<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instadeck Storyboard Starter</title><style>:root{--orange:#ff4500;--coral:#ff4224;--navy:#0f172a;--light:#f8fafc}*{box-sizing:border-box}body{margin:0;background:#d8dee8;font-family:Inter,Arial,sans-serif;display:grid;min-height:100vh;place-content:center}.canvas{position:relative;width:min(56.25vh,90vw);aspect-ratio:9/16;background:var(--light);border-radius:16px;overflow:hidden;box-shadow:0 20px 65px #0f172a33;color:var(--navy)}.accent{position:absolute;top:0;left:0;width:100%;height:12px;background:var(--orange)}.label{position:absolute;top:8%;left:10%;color:var(--coral);font-weight:800;letter-spacing:.14em;font-size:clamp(10px,1.7vh,18px)}.center{position:absolute;inset:25% 10% 25%;display:flex;flex-direction:column;justify-content:center;gap:1rem}.title{font-size:clamp(25px,5vh,65px);line-height:1.05;font-weight:800;letter-spacing:-.05em}.summary{font-size:clamp(12px,2vh,25px);line-height:1.35}.footer{position:absolute;left:10%;right:10%;bottom:12%;display:flex;justify-content:space-between;align-items:center;font-weight:700}.pill{background:var(--coral);padding:.7em 1em;border-radius:999px;color:var(--navy)}.time{font-size:13px;color:#475569}.preview{position:absolute;bottom:3%;left:10%;font-size:12px;color:#475569}button{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);z-index:10;cursor:pointer} @media(prefers-reduced-motion:no-preference){.title{animation:rise .6s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}}</style></head><body><main class="canvas"><div class="accent"></div><div class="label">INSTADECK / STORYBOARD</div><section class="center"><div class="title" id="title">Dari ide ke carousel.</div><div class="summary" id="detail">Tinjauan awal. Ganti dengan screenshot produk asli.</div></section><div class="footer"><div class="pill">Lihat cara kerjanya</div><span class="time" id="clock">00:00</span></div><div class="preview">PREVIEW KONSEP — BUKAN RENDER IKLAN</div></main><button onclick="next()">Scene berikutnya</button><script>const scenes=[['Ide ada. Mulainya?','Hook: perlihatkan tantangan memulai konten.'],['Mulai dari bahan kamu','Tampilkan input topik atau teks pada aplikasi asli.'],['Susun jadi carousel','Tampilkan pemilihan jumlah slide dan hasil nyata.'],['Tampilan sesuai brand','Tampilkan template dan pengaturan brand nyata.'],['Periksa lalu ekspor','Tampilkan ekspor PDF atau PNG sebenarnya.'],['Rencanakan jadwal tayang','Tampilkan kalender dan jadwal yang benar-benar berfungsi.'],['Ide → Carousel → Jadwal','Ringkasan alur produk.'],['Lihat cara kerjanya','Logo asli utuh pada panel putih.']];let i=0;function next(){i=(i+1)%scenes.length;document.getElementById('title').textContent=scenes[i][0];document.getElementById('detail').textContent=scenes[i][1];document.getElementById('clock').textContent=['00:00','00:06','00:14','00:22','00:31','00:40','00:49','00:56'][i]}</script></body></html>
