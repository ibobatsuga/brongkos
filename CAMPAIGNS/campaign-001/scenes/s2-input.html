<!doctype html>
<html lang="id">
  <head><meta charset="UTF-8" /><title>s2-input · 6–14 s · INPUT</title></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: "Inter Local", Arial, sans-serif; color: #0f172a; }
        #s2-wrap { position: absolute; inset: 0; }

        .s2-w { display: inline-block; font-weight: 700; font-size: 84px; line-height: 1.08; letter-spacing: -0.03em; }

        .s2-img { display: block; }
        .s2-tag { position: absolute; padding: 8px 16px; border-radius: 999px; background: #0f172a; color: #ffffff; font-size: 22px; font-weight: 600; }
        #s2-c1 { top: 110px; }
        #s2-c1 .s2-view { height: 220px; }
        #s2-tabs { width: 1861px; height: 220px; }
      </style>
      <div id="root" data-composition-id="s2-input" data-width="1080" data-height="1920">
        <div id="s2-wrap">
          <div id="s2-title">
            <span class="s2-w">Mulai</span>
            <span class="s2-w">dari</span>
            <span class="s2-w s2-acc">bahan</span>
            <span class="s2-w s2-acc">kamu</span>

          <!--
            UI: real Instadeck PRO screenshots from the app repo's tutorial images
            (low-res, may predate production). SWAP for a verified screen recording:
              <video id="s2-ui" src="../assets/ui/s2-input.mp4" muted playsinline data-start="0"

      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power3.out";
        tl.fromTo(".s2-w", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.3, ease, stagger: 0.09 }, 0.1);
        tl.fromTo("#s2-c1", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.4, ease }, 0.35);
        // Camera pans across the real input modes: Link Web → Salin Teks → Ide Prompt.
        tl.fromTo("#s2-tabs", { x: 0 }, { x: -512, duration: 1.4, ease: "power2.inOut" }, 2.0);
        tl.to("#s2-tabs", { x: -1025, duration: 1.4, ease: "power2.inOut" }, 4.0);
        tl.fromTo("#s2-wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in" }, 7.60);
        window.__timelines["s2-input"] = tl;
      </script>
    </template>
