<!doctype html>
<html lang="id">
  <head><meta charset="UTF-8" /><title>captions · 0–60 s · burned-in subtitles</title></head>
  <body>
    <template>
      <style>

        /* Bottom edge at y=1236: above Meta Reels' bottom ~35% overlay zone (y>=1248)

      </style>
      <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
        <!-- BEGIN GENERATED CUES (python3 scripts/campaign_tool.py build; do not hand-edit) -->
        <div id="cap-01" class="cap" data-in="0.267" data-out="1.967"><span class="cap-box">Ide konten sudah ada,</span></div>

      </div>
      <script>
        // Hard on/off per cue, driven by each cue's data-in/data-out (seconds).
        const tl = gsap.timeline({ paused: true });
        document.querySelectorAll('[data-composition-id="captions"] .cap').forEach((el) => {
          tl.set(el, { opacity: 0 }, 0);
          tl.set(el, { opacity: 1 }, parseFloat(el.dataset.in));
          tl.set(el, { opacity: 0 }, parseFloat(el.dataset.out));
        });
        window.__timelines["captions"] = tl;
      </script>
    </template>
  </body>
</html>
