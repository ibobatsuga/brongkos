<!doctype html>
<html lang="id">
  <head><meta charset="UTF-8" /><title>s5-export · 31–40 s · EXPORT</title></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: "Inter Local", Arial, sans-serif; color: #0f172a; }
        #s5-wrap { position: absolute; inset: 0; }
        #s5-title { position: absolute; left: 108px; right: 108px; top: 300px; height: 270px; display: flex; flex-wrap: wrap; align-content: flex-end; column-gap: 22px; }
        .s5-w { display: inline-block; font-weight: 700; font-size: 84px; line-height: 1.08; letter-spacing: -0.03em; }

        /* UI stage: real product screenshots, cropped and zoomed only (scripts/make_ui_crops.sh). */
        #s5-stage { position: absolute; left: 108px; top: 600px; width: 864px; height: 486px; }
        .s5-card { position: absolute; left: 0; width: 864px; padding: 14px; border-radius: 24px; background: #ffffff; border: 2px solid #e2e8f0; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.10); }
        .s5-view { position: relative; width: 836px; overflow: hidden; border-radius: 12px; }
        .s5-img { display: block; }
        .s5-tag { position: absolute; padding: 8px 16px; border-radius: 999px; background: #0f172a; color: #ffffff; font-size: 22px; font-weight: 600; }
        #s5-c1 { top: 10px; }
        #s5-c1 .s5-view { height: 412px; }
        #s5-edit { width: 836px; height: 555px; }
        #s5-tag { left: 0; top: 448px; }
        #s5-c2 { top: 150px; }
        #s5-c2 .s5-view { height: 91px; }
        #s5-bar { width: 836px; height: 91px; }
      </style>
      <div id="root" data-composition-id="s5-export" data-width="1080" data-height="1920">
        <div id="s5-wrap">
          <div id="s5-title">
            <span class="s5-w">Periksa</span>
            <span class="s5-w">lalu</span>
            <span class="s5-w s5-acc">ekspor</span>
          </div>
          <!--
            UI: real Instadeck PRO screenshots from the app repo's tutorial images
            (low-res, may predate production). SWAP for a verified screen recording:
              <video id="s5-ui" src="../assets/ui/s5-export.mp4" muted playsinline data-start="0"
                     style="width:100%;height:100%;object-fit:cover"></video>
          -->
          <div id="s5-stage">
            <div id="s5-c1" class="s5-card"><div class="s5-view"><img id="s5-edit" class="s5-img" src="../assets/ui/s5-edit.png" alt="Pratinjau slide dan kolom teks" /></div></div>
            <span id="s5-tag" class="s5-tag">Contoh konten</span>
            <div id="s5-c2" class="s5-card"><div class="s5-view"><img id="s5-bar" class="s5-img" src="../assets/ui/s5-export-toolbar.png" alt="Toolbar ekspor: Caption, PNG, ZIP, PDF, Jadwalkan" /></div></div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power3.out";
        tl.fromTo(".s5-w", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.3, ease, stagger: 0.09 }, 0.1);
        tl.fromTo("#s5-c1", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.4, ease }, 0.35);
        tl.fromTo("#s5-tag", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.7);
        tl.fromTo("#s5-edit", { y: 0 }, { y: -143, duration: 3.0, ease: "power1.inOut" }, 1.0);
        // Review → export toolbar.
        tl.fromTo(["#s5-c1", "#s5-tag"], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, 4.6);
        tl.fromTo("#s5-c2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease }, 4.75);
        // Punch-in toward PNG / ZIP / PDF.
        tl.fromTo("#s5-bar", { scale: 1 }, { scale: 1.3, duration: 1.2, ease: "power2.inOut", transformOrigin: "68% 50%" }, 6.0);
        tl.fromTo("#s5-wrap", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in" }, 8.60);
        window.__timelines["s5-export"] = tl;
      </script>
    </template>
  </body>
