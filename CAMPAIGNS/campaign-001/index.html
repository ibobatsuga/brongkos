<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Instadeck campaign-001 — Dari Ide ke Carousel (60s, 9:16)</title>
    <!-- GSAP is vendored by scripts/sync_campaign_assets.sh: no render-time network. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter Local"; font-weight: 400; font-style: normal; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter Local"; font-weight: 600; font-style: normal; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter Local"; font-weight: 700; font-style: normal; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f8fafc; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter Local", Arial, sans-serif; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!--
      Timing source of truth: storyboard.json (frames @ 30 fps, 1800 total).
      `python3 scripts/campaign_tool.py verify CAMPAIGNS/campaign-001` fails if
      any host below drifts from it. Scene hosts are back to back, so every
      frame 0..1799 is covered exactly once.
    -->
    <div id="root" data-composition-id="campaign-001" data-start="0" data-duration="60" data-fps="30" data-width="1080" data-height="1920">
      <!-- Persistent light canvas under every scene (no black flash between cuts). -->
      <div id="canvas" class="clip" data-composition-id="canvas" data-composition-src="scenes/canvas.html" data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Scenes (track 1). -->
      <div id="s1-hook" class="clip" data-composition-id="s1-hook" data-composition-src="scenes/s1-hook.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2-input" class="clip" data-composition-id="s2-input" data-composition-src="scenes/s2-input.html" data-start="6" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3-carousel" class="clip" data-composition-id="s3-carousel" data-composition-src="scenes/s3-carousel.html" data-start="14" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4-brand" class="clip" data-composition-id="s4-brand" data-composition-src="scenes/s4-brand.html" data-start="22" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5-export" class="clip" data-composition-id="s5-export" data-composition-src="scenes/s5-export.html" data-start="31" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6-schedule" class="clip" data-composition-id="s6-schedule" data-composition-src="scenes/s6-schedule.html" data-start="40" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s7-recap" class="clip" data-composition-id="s7-recap" data-composition-src="scenes/s7-recap.html" data-start="49" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s8-cta" class="clip" data-composition-id="s8-cta" data-composition-src="scenes/s8-cta.html" data-start="56" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Burned-in subtitles: one caption track, generated from captions.json. -->
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="scenes/captions.html" data-start="0" data-duration="60" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Draft marker. Set data-hidden on this host ONLY for the approved final render. -->
      <div id="draft-mark" class="clip" data-composition-id="draft-mark" data-composition-src="scenes/draft-mark.html" data-start="0" data-duration="60" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!--
        AUDIO (track 4+). Not present yet: no VO, music or SFX has been supplied.
        When the files exist in assets/audio/, add for example:
          <audio id="vo" src="assets/audio/vo-id.wav" data-start="0" data-track-index="4"></audio>
          <audio id="music" src="assets/audio/music-licensed.wav" data-start="0" data-duration="60" data-volume="0.18" data-track-index="5"></audio>
        then re-align captions.json to the measured VO (see campaign README).
      -->
    </div>
    <script>
      // Scenes own their motion; the root timeline only anchors the 60 s window.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["campaign-001"] = tl;
    </script>
  </body>
</html>
